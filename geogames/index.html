<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070d1c">
<meta name="description" content="Eight interactive geography games for parties and quiet afternoons: flags, capitals, country outlines, borders and historical maps, on a globe you can spin.">
<title>GeoGames · Jolly Good Learning</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to the games</a>
  <div class="stars" aria-hidden="true"></div>
  <main id="app" class="app">
    <div class="booting">
      <div class="booting-globe" aria-hidden="true"></div>
      <p>Loading the world…</p>
    </div>
  </main>
  <noscript>
    <div class="boot-error">
      <h1>GeoGames needs JavaScript</h1>
      <p>The globe, the maps and every game are drawn in the browser, so there is nothing to show without it.</p>
    </div>
  </noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
