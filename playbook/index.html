<!DOCTYPE html>
<html lang="en-SG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F2EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
  <title>The Playbook</title>
  <meta name="description" content="Alexey's first phone: setup, the Cards, the Starting XI, time, discernment, health, reflection, and the Pact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { var t = localStorage.getItem('jgl.playbook.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/kickoff" aria-label="The Playbook, contents">
      <span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.6"/></svg></span>
      <span class="brand-name">The Playbook</span>
      <span class="brand-for" id="brandFor"></span>
    </a>
    <span class="spacer"></span>
    <a class="back-home" href="../index.html">All worlds</a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark"></button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Contents" aria-expanded="false" aria-controls="sheet"></button>
  </header>

  <div class="shell">
    <nav class="rail" aria-label="Sections"><ol id="rail"></ol></nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Contents</h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="Close contents"></button>
    </div>
    <ol class="programme" id="sheetList"></ol>
  </div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
