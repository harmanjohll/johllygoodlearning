<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Models — Math Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    body { padding: 0; }
    .page-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: .85rem 1.4rem;
                   display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .back-link { color: var(--muted); border: 1px solid var(--border); border-radius: 7px; padding: .35rem .75rem;
                 font-size: .8rem; font-weight: 600; text-decoration: none; }
    .back-link:hover { background: var(--border); color: var(--text); }
    .hdr { flex: 1; min-width: 180px; font-weight: 800; font-size: .95rem; }
    .hdr span { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; }
    main { max-width: 960px; margin: 0 auto; padding: 1.3rem 1.25rem 4rem; }
    .hero h1 { font-size: 1.5rem; margin-bottom: .3rem; }
    .hero p { color: var(--muted); font-size: .9rem; line-height: 1.7; margin-bottom: 1rem; }

    .frow { display: flex; gap: .3rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .chip { padding: .28rem .7rem; border-radius: 99px; border: 1px solid var(--border); background: transparent;
            color: var(--muted); font-size: .78rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #06131a; }
    .cnt { font-size: .8rem; color: var(--muted); margin-left: auto; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem; margin-bottom: .9rem; }
    .card h2 { font-size: 1rem; margin: 0 0 .45rem; }
    .card p.intro { font-size: .87rem; color: var(--muted); line-height: 1.7; margin: 0 0 .7rem; }

    .rulebox { border: 1px solid var(--border); border-radius: 9px; padding: .55rem .75rem; margin-bottom: .45rem; background: var(--surface); }
    .rulebox b { font-size: .87rem; display: block; margin-bottom: .15rem; }
    .rulebox span { font-size: .82rem; color: var(--muted); line-height: 1.6; }

    .model { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.1rem; margin-bottom: 1rem; }
    .mh { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .3rem; }
    .mh h3 { font-size: 1.05rem; margin: 0; }
    .mh .fam { font-size: .64rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; color: var(--accent);
               border: 1px solid var(--accent); border-radius: 4px; padding: .05rem .35rem; }
    .when { font-size: .87rem; color: var(--muted); line-height: 1.6; margin-bottom: .45rem; }
    .kw { display: flex; gap: .28rem; flex-wrap: wrap; margin-bottom: .6rem; }
    .kw span { font-size: .73rem; padding: .14rem .45rem; border-radius: 5px; background: var(--surface);
               border: 1px solid var(--border); color: var(--accent); }
    .lbl { font-size: .63rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; margin: .7rem 0 .25rem; }
    .drawnote { font-size: .84rem; line-height: 1.6; color: var(--text); background: rgba(56,189,248,.07);
                border: 1px solid rgba(56,189,248,.28); border-radius: 8px; padding: .45rem .65rem; }
    .barwrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .7rem .6rem; }
    .barwrap svg { display: block; }

    .q { font-size: .88rem; line-height: 1.65; color: var(--text); background: var(--surface);
         border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: .5rem .7rem; margin-bottom: .5rem; }
    ol.steps { margin: 0 0 .5rem; padding-left: 1.15rem; }
    ol.steps li { font-size: .86rem; line-height: 1.65; color: var(--muted); margin-bottom: .28rem; }
    .ans { font-size: .9rem; font-weight: 800; color: #86efac; background: rgba(34,197,94,.09);
           border: 1px solid rgba(34,197,94,.3); border-radius: 8px; padding: .45rem .7rem; display: inline-block; }
    .trap { font-size: .84rem; line-height: 1.6; color: #fca5a5; background: rgba(239,68,68,.07);
            border: 1px solid rgba(239,68,68,.28); border-radius: 8px; padding: .5rem .7rem; margin-top: .7rem; }
    .trap b { color: #fecaca; }

    @media (max-width: 680px) { main { padding: 1rem .9rem 3rem; } }
  </style>
</head>
<body>

<header class="page-header">
  <a href="../index.html" class="back-link">← Math Model</a>
  <div class="hdr">The Models<span>What to actually draw, for each kind of problem</span></div>
  <a href="../heuristics/index.html" class="back-link">🧭 Heuristics</a>
</header>

<main>
  <div class="hero">
    <h1>The Models</h1>
    <p id="note">Loading…</p>
  </div>

  <div id="drawing"></div>

  <div class="frow" id="chips"></div>
  <div id="list"></div>
</main>

<script src="../shared.js"></script>
<script>
var D = null, sel = null;
function E(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id) { return document.getElementById(id); }

var FILL = {
  unit:    ['rgba(56,189,248,.22)', '#38bdf8'],
  part:    ['rgba(34,197,94,.22)',  '#22c55e'],
  part2:   ['rgba(167,139,250,.22)','#a78bfa'],
  diff:    ['rgba(251,191,36,.22)', '#fbbf24'],
  fixed:   ['rgba(148,163,184,.18)','#94a3b8'],
  unknown: ['rgba(148,163,184,.10)','#cbd5e1']
};

function svgBars(m) {
  var U = 30, H = 32, GAP = 10, NAME = 96, PAD = 8;
  var bars = m.bars, brace = m.brace;
  var maxU = 0;
  bars.forEach(function (b) {
    var w = (b.offset || 0);
    b.segs.forEach(function (s) { w += s.u; });
    if (w > maxU) maxU = w;
  });
  var braceH = brace ? 26 : 0;
  var W = NAME + maxU * U + 76 + PAD * 2;
  var Ht = braceH + bars.length * (H + GAP) + PAD * 2;
  var o = '<svg viewBox="0 0 ' + W + ' ' + Ht + '" width="' + W + '" height="' + Ht +
          '" role="img" aria-label="bar model for ' + E(m.name) + '">';

  if (brace) {
    var bx = NAME + PAD, bw = maxU * U;
    o += '<path d="M' + bx + ' ' + (PAD + 16) + ' L' + bx + ' ' + (PAD + 9) + ' L' + (bx + bw) + ' ' +
         (PAD + 9) + ' L' + (bx + bw) + ' ' + (PAD + 16) + '" fill="none" stroke="var(--muted)" stroke-width="1.3"/>';
    o += '<text x="' + (bx + bw / 2) + '" y="' + (PAD + 5) + '" text-anchor="middle" font-size="11.5" ' +
         'fill="var(--text)" font-weight="700">' + E(brace.text) + '</text>';
  }

  bars.forEach(function (b, i) {
    var y = PAD + braceH + i * (H + GAP);
    o += '<text x="' + (PAD + NAME - 10) + '" y="' + (y + H / 2 + 4) + '" text-anchor="end" font-size="11.5" ' +
         'fill="var(--muted)" font-weight="700">' + E(b.name) + '</text>';
    var x = PAD + NAME + (b.offset || 0) * U;
    b.segs.forEach(function (s) {
      var f = FILL[s.k] || FILL.unit;
      var w = s.u * U;
      o += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + H + '" fill="' + f[0] +
           '" stroke="' + f[1] + '" stroke-width="1.4"' + (s.k === 'unknown' ? ' stroke-dasharray="4 3"' : '') + '/>';
      if (s.t) {
        o += '<text x="' + (x + w / 2) + '" y="' + (y + H / 2 + 4) + '" text-anchor="middle" font-size="11" ' +
             'fill="var(--text)" font-weight="700">' + E(s.t) + '</text>';
      }
      x += w;
    });
    if (b.right) {
      o += '<text x="' + (x + 8) + '" y="' + (y + H / 2 + 4) + '" font-size="11" fill="var(--muted)" ' +
           'font-weight="700">' + E(b.right) + '</text>';
    }
  });
  return o + '</svg>';
}

function modelHTML(m) {
  return '<div class="model">' +
    '<div class="mh"><h3>' + E(m.name) + '</h3><span class="fam">' + E(m.family) + '</span></div>' +
    '<div class="when">' + E(m.when) + '</div>' +
    '<div class="kw">' + m.words.map(function (w) { return '<span>' + E(w) + '</span>'; }).join('') + '</div>' +
    '<div class="lbl">What to draw</div><div class="drawnote">' + E(m.draw) + '</div>' +
    '<div class="lbl">The model</div><div class="barwrap">' + svgBars(m) + '</div>' +
    '<div class="lbl">Worked through</div>' +
    '<div class="q">' + E(m.example.q) + '</div>' +
    '<ol class="steps">' + m.example.steps.map(function (s) { return '<li>' + E(s) + '</li>'; }).join('') + '</ol>' +
    '<div class="ans">' + E(m.example.answer) + '</div>' +
    '<div class="trap"><b>The mistake this one invites:</b> ' + E(m.trap) + '</div>' +
    '</div>';
}

function render() {
  var list = sel ? D.models.filter(function (m) { return m.family === sel; }) : D.models;
  $('list').innerHTML = list.map(modelHTML).join('');
  var fams = [];
  D.models.forEach(function (m) { if (fams.indexOf(m.family) === -1) fams.push(m.family); });
  $('chips').innerHTML = fams.map(function (f) {
    var n = D.models.filter(function (m) { return m.family === f; }).length;
    return '<button class="chip' + (sel === f ? ' on' : '') + '" type="button" data-f="' + E(f) + '">' +
      E(f) + ' ' + n + '</button>';
  }).join('') + '<span class="cnt" id="cnt"></span>';
  $('cnt').textContent = list.length + ' of ' + D.models.length + ' models';
}

document.addEventListener('click', function (ev) {
  var c = ev.target.closest ? ev.target.closest('[data-f]') : null;
  if (!c) return;
  var f = c.getAttribute('data-f');
  sel = (sel === f) ? null : f;
  render();
});

fetch('../content/models.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
  .then(function (d) {
    D = d;
    $('note').textContent = d.meta.note + ' ' + d.meta.howToRead;
    $('drawing').innerHTML = '<div class="card"><h2>' + E(d.drawing.title) + '</h2>' +
      d.drawing.rules.map(function (r) {
        return '<div class="rulebox"><b>' + E(r.r) + '</b><span>' + E(r.w) + '</span></div>';
      }).join('') + '</div>';
    render();
  })
  .catch(function () { $('note').textContent = 'Could not load the models data.'; });
</script>
</body>
</html>
